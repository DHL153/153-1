<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>미소녀 수박 게임</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 360px;
    }

    #game-frame {
      width: 100%;
      border: 4px solid #ff70a6;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(255, 112, 166, 0.25);
      background: #2b2b36;
    }

    #score-board {
      width: 100%;
      padding: 10px 16px;
      background: #2b2b36;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #ff70a6;
    }
    .score-title { font-size: 11px; color: #ff70a6; font-weight: bold; letter-spacing: 1px; }
    .score-value { font-size: 22px; font-weight: bold; color: #fff; }
    .next-box { display: flex; align-items: center; gap: 8px; }
    #next-canvas {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #ff70a6;
      background-color: #fff;
    }

    #canvas-wrapper {
      position: relative;
      width: 360px;
      height: 520px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none; 
    }

    #warning-banner {
      display: none;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 85, 0.95);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #fff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
      z-index: 5;
      animation: blink 0.5s infinite alternate;
    }
    @keyframes blink {
      from { opacity: 0.8; transform: translateX(-50%) scale(1); }
      to { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    #item-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 10px;
      gap: 4px;
    }
    
    .item-btn {
      flex: 1;
      background: #2b2b36;
      border: 2px solid #ff70a6;
      color: #fff;
      border-radius: 8px;
      padding: 6px 2px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      outline: none;
      -webkit-tap-highlight-color: transparent; 
    }

    @media (hover: hover) and (pointer: fine) {
      .item-btn:hover:not(:disabled):not(.active) {
        background: #ff70a6;
        color: #fff;
      }
    }
    
    .item-btn:active:not(:disabled) {
      background: #ff477e; 
      transform: scale(0.95);
    }
    
    .item-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #555;
    }
    .item-btn.active {
      border-color: #00ffcc;
      background: #3d2b4f !important;
      box-shadow: 0 0 10px #00ffcc;
      animation: pulse 0.8s infinite alternate;
    }
    .count {
      font-size: 9px;
      color: #ffbcda;
      background: rgba(0,0,0,0.4);
      padding: 1px 5px;
      border-radius: 8px;
    }

    .timer {
      font-size: 9px;
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 5px;
      border-radius: 8px;
      display: none; 
      font-weight: bold;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    #game-over {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #game-over h1 { color: #ff477e; margin: 0 0 10px 0; font-size: 32px; }
    #game-over p { font-size: 18px; margin-bottom: 20px; color: #fff; }
    #restart-btn {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      background: #ff70a6;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    #restart-btn:hover { background: #ff477e; transform: scale(1.05); }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game-frame">
      <div id="score-board">
        <div>
          <div class="score-title">SCORE</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="next-box">
          <div class="score-title">NEXT</div>
          <canvas id="next-canvas" width="38" height="38"></canvas>
        </div>
      </div>

      <div id="canvas-wrapper">
        <div id="warning-banner">⚠️ 위험! <span id="warning-timer">5.0</span>초 남음</div>
        <canvas id="game-canvas" width="360" height="520"></canvas>
        <div id="game-over">
          <h1>GAME OVER</h1>
          <p>최종 점수: <span id="final-score">0</span>점</p>
          <button id="restart-btn" onclick="resetGame()">다시 시작</button>
        </div>
      </div>
    </div>

    <div id="item-bar">
      <button class="item-btn" id="btn-next" onclick="useNextSwap()">
        🔄 NEXT 교체
        <span class="count" id="cnt-next">10회</span>
      </button>
      <button class="item-btn" id="btn-hammer" onclick="toggleHammer()">
        🔨 뿅망치
        <span class="count" id="cnt-hammer">10회</span>
      </button>
      <button class="item-btn" id="btn-bomb" onclick="toggleCleanBomb()">
        💣 클린폭탄
        <span class="count" id="cnt-bomb">10회</span>
      </button>
      <button class="item-btn" id="btn-shake" onclick="useShake()">
        🫨 쉐이크
        <span class="count" id="cnt-shake">10회</span>
      </button>
      <button class="item-btn" id="btn-tilt" onclick="useGravityTilt()">
        ⚖️ 중력 틸트
        <span class="count" id="cnt-tilt">10회</span>
        <span class="timer" id="timer-tilt">7.0s</span>
      </button>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;

    let engine, render, runner;
    let score = 0;
    let currentFruitLevel = 0;
    let nextFruitLevel = 0;
    let canDrop = true;
    let isGameOver = false;

    let isHammerActive = false;
    let isBombActive = false;
    let isTiltActive = false;
    
    let tiltRemainingTime = 0; 
    let lastActionTime = 0; 

    const itemCounts = { next: 10, hammer: 10, bomb: 10, shake: 10, tilt: 10 };

    const DEADLINE_Y = 75;            
    const DEADLINE_TIME_LIMIT = 5000; 
    let deadlineOverTime = 0;         
    let lastTime = Date.now();

    let explosionEffects = [];

    const FRUITS = [
      { radius: 16, name: 'Lv1' },
      { radius: 24, name: 'Lv2' },
      { radius: 32, name: 'Lv3' },
      { radius: 42, name: 'Lv4' },
      { radius: 54, name: 'Lv5' },
      { radius: 68, name: 'Lv6' },
      { radius: 84, name: 'Lv7' },
      { radius: 102, name: 'Lv8' },
      { radius: 122, name: 'Lv9' },
      { radius: 144, name: 'Lv10' }
    ];

    const preloadedImages = [];
    for (let i = 1; i <= 10; i++) {
      const img = new Image();
      const numStr = String(i).padStart(2, '0');
      img.src = `images/lv${numStr}.png`;
      preloadedImages.push(img);
      img.onload = () => updateNextCanvas();
    }

    const canvas = document.getElementById('game-canvas');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');

    function addScore(points) {
      score += points;
      document.getElementById('score').innerText = score;
    }

    function init() {
      engine = Engine.create({
        enableSleeping: false 
      });
      engine.gravity.x = 0;
      engine.gravity.y = 1.2;
      
      // 💡 움직임 속도 1.5배 (기존 대비 50% 향상)
      engine.timing.timeScale = 1.5; 
      
      engine.positionIterations = 16; 
      engine.velocityIterations = 16; 

      render = Render.create({
        canvas: canvas,
        engine: engine,
        options: { width: 360, height: 520, wireframes: false, background: '#2b2b36', pixelRatio: 1 }
      });

      Render.run(render);
      runner = Runner.create();
      Runner.run(runner, engine);

      setupWalls();

      Events.on(engine, 'collisionStart', handleCollision);
      Events.on(render, 'afterRender', gameLoop);

      currentFruitLevel = getRandomStartLevel();
      nextFruitLevel = getRandomStartLevel();
      updateNextCanvas();

      lastTime = Date.now();
      deadlineOverTime = 0;
      document.getElementById('warning-banner').style.display = 'none';

      canvas.addEventListener('pointerdown', handlePointerMove);
      canvas.addEventListener('pointermove', handlePointerMove);
      canvas.addEventListener('pointerup', handleCanvasClick);

      initGyroscope();
    }

    function setupWalls() {
      const wallOptions = { isStatic: true, friction: 0, render: { visible: false } };
      Composite.add(engine.world, [
        Bodies.rectangle(5, -240, 10, 1520, wallOptions),
        Bodies.rectangle(355, -240, 10, 1520, wallOptions),
        Bodies.rectangle(180, 515, 360, 10, wallOptions),
        Bodies.rectangle(180, -1000, 360, 50, wallOptions)
      ]);
    }

    function getRandomStartLevel() { return Math.floor(Math.random() * 3); }

    function updateNextCanvas() {
      nextCtx.clearRect(0, 0, 38, 38);
      const img = preloadedImages[nextFruitLevel];
      
      if (img && img.complete) {
        const drawRadius = 14; 
        const drawSize = drawRadius * 2;
        nextCtx.drawImage(img, 19 - drawRadius, 19 - drawRadius, drawSize, drawSize);
      }
    }

    function gameLoop() {
      const now = Date.now();
      const dt = Math.min(now - lastTime, 100);
      lastTime = now;

      const ctx = render.context;

      if (isTiltActive) {
        tiltRemainingTime -= dt;
        
        if (tiltRemainingTime > 0) {
          document.getElementById('timer-tilt').innerText = (tiltRemainingTime / 1000).toFixed(1) + 's';
        } else {
          isTiltActive = false;
          engine.gravity.x = 0;
          engine.gravity.y = 1.2;
          
          const btn = document.getElementById('btn-tilt');
          btn.classList.remove('active');
          btn.blur();
          
          document.getElementById('timer-tilt').style.display = 'none';
          document.getElementById('cnt-tilt').style.display = 'inline-block';
        }
      } else {
        if (engine.gravity.x !== 0) engine.gravity.x = 0;
        if (engine.gravity.y !== 1.2) engine.gravity.y = 1.2;
      }

      drawCustomFruits(ctx);
      drawExplosions(ctx);

      if (canDrop && !isGameOver && !isHammerActive && !isBombActive) {
        const mouseX = Math.max(20, Math.min(340, currentMouseX));
        const fruit = FRUITS[currentFruitLevel];
        const img = preloadedImages[currentFruitLevel];

        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(255, 112, 166, 0.5)';
        ctx.moveTo(mouseX, DEADLINE_Y);
        ctx.lineTo(mouseX, 510);
        ctx.stroke();
        ctx.setLineDash([]);

        if (img && img.complete) {
          const drawSize = fruit.radius * 2;
          ctx.drawImage(img, mouseX - fruit.radius, 35 - fruit.radius, drawSize, drawSize);
        }
      }

      ctx.beginPath();
      ctx.moveTo(0, DEADLINE_Y);
      ctx.lineTo(360, DEADLINE_Y);
      ctx.strokeStyle = deadlineOverTime > 0 ? '#ff0055' : 'rgba(255, 112, 166, 0.6)';
      ctx.lineWidth = deadlineOverTime > 0 ? 3 : 1;
      ctx.stroke();

      if (!isGameOver) checkDeadlineGraceSystem(dt, now);
    }

    function drawCustomFruits(ctx) {
      const bodies = Composite.allBodies(engine.world);
      ctx.save();
      for (let body of bodies) {
        if (body.customLevel !== undefined) {
          const fruit = FRUITS[body.customLevel];
          const pos = body.position;
          const angle = body.angle;
          const img = preloadedImages[body.customLevel];

          ctx.translate(pos.x, pos.y);
          ctx.rotate(angle);

          if (img && img.complete) {
            const drawSize = fruit.radius * 2;
            ctx.drawImage(img, -fruit.radius, -fruit.radius, drawSize, drawSize);
          }

          ctx.rotate(-angle);
          ctx.translate(-pos.x, -pos.y);
        }
      }
      ctx.restore();
    }

    function checkDeadlineGraceSystem(dt, now) {
      const bodies = Composite.allBodies(engine.world);
      let isOverflow = false;

      for (let b of bodies) {
        if (!b.isStatic && b.customLevel !== undefined) {
          if (b.spawnTime && (now - b.spawnTime < 1000)) continue;
          const fruitRadius = FRUITS[b.customLevel].radius;
          if (b.position.y - fruitRadius <= DEADLINE_Y && Math.abs(b.velocity.y) < 0.3) {
            isOverflow = true;
            break;
          }
        }
      }

      const warningBanner = document.getElementById('warning-banner');
      const warningTimer = document.getElementById('warning-timer');

      if (isOverflow) {
        deadlineOverTime += dt;
        const remaining = Math.max(0, (DEADLINE_TIME_LIMIT - deadlineOverTime) / 1000);
        warningTimer.innerText = remaining.toFixed(1);
        warningBanner.style.display = 'block';

        if (deadlineOverTime >= DEADLINE_TIME_LIMIT) triggerGameOver();
      } else {
        deadlineOverTime = Math.max(0, deadlineOverTime - dt * 2);
        if (deadlineOverTime === 0) warningBanner.style.display = 'none';
      }
    }

    let currentMouseX = 180;
    
    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      currentMouseX = e.clientX - rect.left;
    }

    function handleCanvasClick(e) {
      if (isGameOver) return;
      
      const now = Date.now();
      if (now - lastActionTime < 300) return; 

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      if (isHammerActive) {
        const bodies = Composite.allBodies(engine.world);
        const clickedBody = bodies.find(b => {
          if (b.isStatic || b.customLevel === undefined) return false;
          return Math.hypot(b.position.x - clickX, b.position.y - clickY) <= FRUITS[b.customLevel].radius;
        });
        
        if (clickedBody) {
          lastActionTime = now; 
          addScore((clickedBody.customLevel + 1) * 10);
          Composite.remove(engine.world, clickedBody);
          itemCounts.hammer--;
          document.getElementById('cnt-hammer').innerText = `${itemCounts.hammer}회`;
          if (itemCounts.hammer === 0) document.getElementById('btn-hammer').disabled = true;
          toggleHammer();
        }
        return; 
      }

      if (isBombActive) {
        const bodies = Composite.allBodies(engine.world);
        
        const clickedBody = bodies.find(b => {
          if (b.isStatic || b.customLevel === undefined) return false;
          return Math.hypot(b.position.x - clickX, b.position.y - clickY) <= FRUITS[b.customLevel].radius;
        });
        
        if (clickedBody) {
          lastActionTime = now; 
          const targetLevel = clickedBody.customLevel;
          const targets = bodies.filter(b => !b.isStatic && b.customLevel === targetLevel);
          
          let gainedScore = 0;
          targets.forEach(b => {
            explosionEffects.push({ 
              x: b.position.x, 
              y: b.position.y, 
              radius: 10, 
              maxRadius: FRUITS[targetLevel].radius * 2, 
              alpha: 1 
            });
            gainedScore += (b.customLevel + 1) * 5;
            Composite.remove(engine.world, b);
          });
          
          addScore(gainedScore);
          itemCounts.bomb--;
          document.getElementById('cnt-bomb').innerText = `${itemCounts.bomb}회`;
          if (itemCounts.bomb === 0) document.getElementById('btn-bomb').disabled = true;
          toggleCleanBomb();
        }
        return; 
      }

      if (!canDrop) return;
      
      lastActionTime = now; 
      const fruit = FRUITS[currentFruitLevel];
      const dropX = Math.max(fruit.radius + 10, Math.min(350 - fruit.radius, clickX));
      
      const body = Bodies.circle(dropX, 40, fruit.radius, {
        restitution: 0.2, 
        friction: 0.02, 
        customLevel: currentFruitLevel, 
        spawnTime: Date.now(), 
        render: { visible: false }
      });

      Composite.add(engine.world, body);
      canDrop = false;

      setTimeout(() => {
        currentFruitLevel = nextFruitLevel;
        nextFruitLevel = getRandomStartLevel();
        updateNextCanvas();
        canDrop = true;
      }, 400);
    }

    function handleCollision(event) {
      event.pairs.forEach(pair => {
        const { bodyA, bodyB } = pair;
        if (bodyA.customLevel !== undefined && bodyB.customLevel !== undefined) {
          if (bodyA.customLevel === bodyB.customLevel) {
            const currentLvl = bodyA.customLevel;
            if (currentLvl < FRUITS.length - 1) {
              const newLvl = currentLvl + 1;
              const midX = (bodyA.position.x + bodyB.position.x) / 2;
              const midY = (bodyA.position.y + bodyB.position.y) / 2;
              Composite.remove(engine.world, [bodyA, bodyB]);
              const newFruit = FRUITS[newLvl];
              
              const mergedBody = Bodies.circle(midX, midY, newFruit.radius, {
                restitution: 0.2, 
                friction: 0.02, 
                customLevel: newLvl, 
                spawnTime: Date.now(), 
                render: { visible: false }
              });
              Composite.add(engine.world, mergedBody);
              addScore((newLvl + 1) * 2);
            }
          }
        }
      });
    }

    function useNextSwap() {
      if (itemCounts.next <= 0) return;
      itemCounts.next--;
      document.getElementById('cnt-next').innerText = `${itemCounts.next}회`;
      if (itemCounts.next === 0) document.getElementById('btn-next').disabled = true;
      const temp = currentFruitLevel;
      currentFruitLevel = nextFruitLevel;
      nextFruitLevel = temp;
      updateNextCanvas();
      addScore(10);
      document.getElementById('btn-next').blur(); 
    }

    function toggleHammer() {
      if (itemCounts.hammer <= 0 && !isHammerActive) return;
      if (isBombActive) toggleCleanBomb();
      isHammerActive = !isHammerActive;
      const btn = document.getElementById('btn-hammer');
      btn.classList.toggle('active', isHammerActive);
      if (!isHammerActive) btn.blur(); 
      canvas.style.cursor = isHammerActive ? 'pointer' : 'crosshair';
    }

    function toggleCleanBomb() {
      if (itemCounts.bomb <= 0 && !isBombActive) return;
      if (isHammerActive) toggleHammer();
      isBombActive = !isBombActive;
      const btn = document.getElementById('btn-bomb');
      btn.classList.toggle('active', isBombActive);
      if (!isBombActive) btn.blur(); 
      canvas.style.cursor = isBombActive ? 'pointer' : 'crosshair';
    }

    function useShake() {
      if (itemCounts.shake <= 0) return;
      itemCounts.shake--;
      document.getElementById('cnt-shake').innerText = `${itemCounts.shake}회`;
      if (itemCounts.shake === 0) document.getElementById('btn-shake').disabled = true;

      const btn = document.getElementById('btn-shake');
      btn.classList.add('active');

      const bodies = Composite.allBodies(engine.world);
      bodies.forEach(b => {
        if (!b.isStatic) {
          // 💡 쉐이크 반동 1.5배 상향 (가속도 및 회전력 증가)
          Body.setVelocity(b, { 
            x: (Math.random() - 0.5) * 42, 
            y: -Math.random() * 27 - 12 
          });
          Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.6);
        }
      });
      addScore(20);

      setTimeout(() => {
        btn.classList.remove('active'); 
        btn.blur();
      }, 500);
    }

    function useGravityTilt() {
      if (itemCounts.tilt <= 0 || isTiltActive) return;
      
      itemCounts.tilt--;
      document.getElementById('cnt-tilt').innerText = `${itemCounts.tilt}회`;
      if (itemCounts.tilt === 0) document.getElementById('btn-tilt').disabled = true;

      isTiltActive = true;
      // 💡 틸트 지속 시간 7초(7000ms)로 변경
      tiltRemainingTime = 7000; 
      
      const btn = document.getElementById('btn-tilt');
      btn.classList.add('active'); 

      document.getElementById('cnt-tilt').style.display = 'none';
      const timerSpan = document.getElementById('timer-tilt');
      timerSpan.style.display = 'inline-block';
      timerSpan.innerText = '7.0s';

      addScore(20);
    }

    function initGyroscope() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (isTiltActive && !isGameOver) {
            if (e.gamma !== null && e.beta !== null) {
              const tiltX = Math.max(-45, Math.min(45, e.gamma));
              engine.gravity.x = (tiltX / 45) * 1.5;

              let deltaBeta = e.beta - 45;
              deltaBeta = Math.max(-45, Math.min(45, deltaBeta)); 
              engine.gravity.y = 1.2 + (deltaBeta / 45) * 1.5;
            }
          }
        });
      }
    }

    function drawExplosions(ctx) {
      for (let i = explosionEffects.length - 1; i >= 0; i--) {
        const exp = explosionEffects[i];
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 71, 126, ${exp.alpha})`;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
        exp.radius += 6; 
        exp.alpha -= 0.08;
        if (exp.alpha <= 0) explosionEffects.splice(i, 1);
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      isTiltActive = false;
      tiltRemainingTime = 0;
      engine.gravity.x = 0;
      engine.gravity.y = 1.2;
      
      const tiltBtn = document.getElementById('btn-tilt');
      const shakeBtn = document.getElementById('btn-shake');
      tiltBtn.classList.remove('active');
      shakeBtn.classList.remove('active');
      tiltBtn.blur();
      shakeBtn.blur();
      
      document.getElementById('timer-tilt').style.display = 'none';
      document.getElementById('cnt-tilt').style.display = 'inline-block';

      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'flex';
      document.getElementById('warning-banner').style.display = 'none';
    }

    function resetGame() {
      Composite.clear(engine.world, false, true);
      score = 0;
      isGameOver = false;
      isTiltActive = false;
      tiltRemainingTime = 0;
      engine.gravity.x = 0;
      engine.gravity.y = 1.2;
      lastTime = Date.now();
      lastActionTime = 0;
      
      document.getElementById('score').innerText = '0';
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('warning-banner').style.display = 'none';
      
      document.getElementById('timer-tilt').style.display = 'none';
      document.getElementById('cnt-tilt').style.display = 'inline-block';
      
      Object.keys(itemCounts).forEach(k => itemCounts[k] = 10);
      document.querySelectorAll('.item-btn').forEach(btn => {
        btn.disabled = false;
        btn.classList.remove('active');
        btn.blur();
      });
      document.getElementById('cnt-next').innerText = '10회';
      document.getElementById('cnt-hammer').innerText = '10회';
      document.getElementById('cnt-bomb').innerText = '10회';
      document.getElementById('cnt-shake').innerText = '10회';
      document.getElementById('cnt-tilt').innerText = '10회';

      setupWalls();
    }

    window.onload = init;
  </script>
</body>
</html>
